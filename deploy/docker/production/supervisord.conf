[supervisord]
pidfile=%(here)s/supervisord.pid
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
nodaemon=true
minfds=1024
minprocs=200
user=nginx

# Run nginx in the foreground under supervisord (instead of `service nginx start`
# in the entrypoint) so a crashed nginx is restarted and its logs are unified
# with the worker logs. nginx listens on the unprivileged port 8000, so it runs
# fine as the non-root `nginx` user configured above.
[program:nginx]
autorestart=true
stopsignal=QUIT
stopwaitsecs=30
startsecs=6
command=/usr/sbin/nginx -g "daemon off;"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
redirect_stderr=true

[program:ff1]
autorestart=true
startsecs=6
command=pserve production.ini http_port=6543
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
redirect_stderr=true

