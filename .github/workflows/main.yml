name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Test Suite for fourfront (Python 3.11, Node 20)
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        test_type: [UNIT, NPM, Docker]
        python_version: ['3.11']
        node_version: ['20']
        include:
          - test_type: UNIT
            namespace: unit
          - test_type: NPM
            namespace: npm
          - test_type: Docker
            namespace: docker
    env:
      # Include the attempt so reruns cannot clean up another attempt's resources.
      TEST_JOB_ID: ff-${{ matrix.namespace }}-test-${{ github.run_id }}-${{ github.run_attempt }}-
      TRAVIS_JOB_ID: ff-${{ matrix.namespace }}-test-${{ github.run_id }}-${{ github.run_attempt }}-
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
          check-latest: false

      - name: Install/Link Postgres
        if: ${{ matrix.test_type != 'Docker' }}
        run: |
          sudo apt-get install curl ca-certificates gnupg
          curl https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install postgresql-14 postgresql-client-14
          echo "/usr/lib/postgresql/14/bin" >> $GITHUB_PATH
          sudo ln -s /usr/lib/postgresql/14/bin/initdb /usr/local/bin/initdb

      - name: Install Deps
        if: ${{ matrix.test_type != 'Docker' }}
        run: |
          node --version
          make build

      - name: Configure AWS credentials
        if: ${{ matrix.test_type != 'Docker' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::643366669028:role/4dn-dcic-github-actions-deployment-role
          role-session-name: fourfront-unit-testing-session
          aws-region: us-east-1

      - name: QA (NPM)
        if: ${{ matrix.test_type == 'NPM' }}
        env:
          S3_ENCRYPT_KEY: ${{ secrets.S3_ENCRYPT_KEY }}
          GLOBAL_ENV_BUCKET: ${{ secrets.GLOBAL_ENV_BUCKET }}
          ACCOUNT_NUMBER: ${{ secrets.ACCOUNT_NUMBER }}
          # Must name a provisioned, assumable PutObject role; no self-assumption fallback.
          S3_UPLOAD_ROLE_ARN: ${{ vars.S3_UPLOAD_ROLE_ARN }}
        run: make remote-test-npm

      - name: QA (UNIT)
        if: ${{ matrix.test_type == 'UNIT' }}
        env:
          S3_ENCRYPT_KEY: ${{ secrets.S3_ENCRYPT_KEY }}
          GLOBAL_ENV_BUCKET: ${{ secrets.GLOBAL_ENV_BUCKET }}
          ACCOUNT_NUMBER: ${{ secrets.ACCOUNT_NUMBER }}
          S3_UPLOAD_ROLE_ARN: ${{ vars.S3_UPLOAD_ROLE_ARN }}
        run: make remote-test-unit

      - name: Cleanup indices
        if: ${{ always() && matrix.test_type != 'Docker' }}
        run: poetry run wipe-test-indices "$TEST_JOB_ID" search-fourfront-testing-opensearch-kqm7pliix4wgiu4druk2indorq.us-east-1.es.amazonaws.com:443

      - name: Cleanup indexer queues
        if: ${{ always() && matrix.test_type != 'Docker' }}
        # Independent of index cleanup; the command reports missing IAM permissions.
        run: poetry run wipe-test-indexer-queues "$TEST_JOB_ID"

      - name: Docker Build
        if: ${{ matrix.test_type == 'Docker' && matrix.node_version == '20' && matrix.python_version == '3.11' }}
        run: |
          touch deploy/docker/local/docker_development.ini
          docker build .
